<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1014">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wayfare">
<title>Wayfare Spremljevalec</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="ikona-180.png">
<link rel="icon" href="ikona-192.png">
<style>
:root{--bg:#0f1014;--plosca:rgba(255,255,255,.06);--rob:rgba(255,255,255,.12);--fg:#f4f4f6;
  --muted:#a9a9b3;--zvezda:#f5c542;--rdeca:#ff5a5f;--r:18px;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Avenir Next",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent}
body{min-height:100dvh;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 12px)}
header{display:flex;align-items:center;gap:12px;padding:18px 2px 14px}
header img{width:40px;height:40px;border-radius:11px}
header b{display:block;font-size:18px;letter-spacing:-.01em}
header span{color:var(--muted);font-size:13px}
main{flex:1;display:flex;flex-direction:column;gap:12px}
button{font:inherit;color:inherit;border:1px solid var(--rob);background:var(--plosca);
  border-radius:var(--r);cursor:pointer}
button:active{transform:scale(.985)}
.velik{display:grid;grid-template-columns:56px 1fr;grid-template-rows:auto auto;align-items:center;
  column-gap:14px;text-align:left;padding:18px;min-height:96px}
.velik .ikona{grid-row:1/3;width:56px;height:56px;border-radius:50%;display:flex;
  align-items:center;justify-content:center;font-size:28px;background:rgba(255,255,255,.1)}
.velik b{font-size:19px}
.velik span{color:var(--muted);font-size:14px}
#oznaci .ikona{color:var(--zvezda)}
#snemaj .ikona{color:var(--rdeca)}
#snemaj.tece{border-color:var(--rdeca);background:rgba(255,90,95,.12)}
#snemaj.tece .ikona{animation:utrip 1.2s ease-in-out infinite}
@keyframes utrip{50%{opacity:.35}}
.potrditev{display:flex;gap:8px}
.potrditev input{flex:1;min-width:0;font:inherit;color:var(--fg);background:var(--plosca);
  border:1px solid var(--rob);border-radius:12px;padding:12px 14px}
.potrditev button{padding:0 16px}
h2{font-size:14px;color:var(--muted);font-weight:600;margin:14px 2px 4px}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--plosca)}
li .ura{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;min-width:44px}
li .vrsta{width:22px;text-align:center}
li .opomba{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
li .opomba.prazna{color:var(--muted)}
li button{border:none;background:none;padding:6px 8px;color:var(--muted);font-size:15px}
li.poslano{opacity:.55}
.prazno{color:var(--muted);font-size:14px;margin:4px 2px}
footer{display:flex;flex-direction:column;gap:10px;padding-top:16px}
.glavni{background:var(--fg);color:#0b0b0d;border:none;font-weight:600;padding:16px;font-size:17px}
.glavni:disabled{opacity:.4}
.drobno{color:var(--muted);font-size:13px;margin:0 2px}
.vrstica{display:flex;justify-content:space-between;align-items:center;gap:10px}
.vrstica label{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.vrstica button{padding:8px 12px;font-size:14px;color:var(--muted)}
#obvestilo{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 20px);
  padding:14px 16px;border-radius:14px;background:#24252b;border:1px solid var(--rob);
  font-size:15px;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none}
#obvestilo.vidno{opacity:1;transform:none}
</style>
</head>
<body>
<header>
  <img src="ikona-192.png" alt="">
  <div><b data-t="naslov">Spremljevalec</b><span id="dan"></span></div>
</header>
<main>
  <button id="oznaci" class="velik"><span class="ikona" aria-hidden="true">★</span>
    <b data-t="oznaci">Označi trenutek</b><span data-t="oznaci_opis">Kar je bilo dobro. Studio ga najde v posnetkih.</span></button>
  <button id="snemaj" class="velik"><span class="ikona" aria-hidden="true">●</span>
    <b id="snemajNaslov" data-t="zapisek">Glasovni zapisek</b><span id="snemajOpis" data-t="zapisek_opis">Povej, kaj se je zgodilo. Doma je za pripoved.</span></button>
  <div class="potrditev" id="opombaVrsta" hidden>
    <input id="opomba" maxlength="300" autocomplete="off" data-tp="opomba_ph" placeholder="Opomba (neobvezno)">
    <button id="opombaOk" data-t="shrani">Shrani</button>
  </div>
  <h2 id="naslovSeznama" data-t="danes">Danes</h2>
  <ul id="seznam"></ul>
  <p class="prazno" id="prazno" data-t="prazno">Še nič. Med potjo tapni zvezdico, ko se zgodi kaj dobrega.</p>
</main>
<footer>
  <button id="poslji" class="glavni" data-t="poslji">Pošlji na Mac</button>
  <p class="drobno" data-t="kako">Pošlje datoteko (AirDrop, Datoteke). Na Macu jo povleci v projekt dneva v Wayfare Studiu. Nič ne gre na splet.</p>
  <div class="vrstica">
    <label><input type="checkbox" id="gps"> <span data-t="gps">Shrani kraj (GPS)</span></label>
    <button id="pocisti" hidden data-t="pocisti">Pobriši poslane</button>
  </div>
</footer>
<div id="obvestilo" role="status" aria-live="polite"></div>
<script src="telefon.js"></script>
</body>
</html>
