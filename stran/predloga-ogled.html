<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ogled_naslov_strani}}</title>
<meta name="description" content="{{ogled_opis_meta}}">
<meta property="og:title" content="{{ogled_naslov_strani}}">
<meta property="og:description" content="{{ogled_opis_meta}}">
<meta property="og:image" content="{{ogled_slika}}">
<meta property="og:type" content="video.other">
<link rel="alternate" hreflang="en" href="{{url_en}}">
<link rel="alternate" hreflang="sl" href="{{url_sl}}">
<link rel="icon" href="{{koren}}media/logo.svg" type="image/svg+xml">
<meta http-equiv="Content-Security-Policy" content="{{csp}}">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="preload" href="{{koren}}pisave/instrument-sans-latin-11aa49.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ogled_slika}}" as="image">
<link rel="stylesheet" href="{{koren}}css/pisave.css">
<link rel="stylesheet" href="{{koren}}css/slog.css">
<link rel="stylesheet" href="{{koren}}css/ogled.css">
<script>document.documentElement.classList.add("js");{{preusmeritev}}</script>
</head>
<body>
<!-- Ta datoteka je zgrajena iz predloga-ogled.html, deli/ in besedila.json (python3 zgradi.py). Ne urejaj je ročno. -->
<div class="svet" aria-hidden="true">
  <span class="svet-luc svet-luc-1" data-luc></span>
  <span class="svet-luc svet-luc-2" data-luc></span>
  <span class="svet-luc svet-luc-3" data-luc></span>
  <span class="svet-kazalec" data-kazalec></span>
</div>
<a class="preskoci" href="#vsebina">{{preskoci}}</a>

{{glava}}

<main id="vsebina" class="ogled-stran">
  <div class="ogled{{ogled_razred}}">
    <article class="ogled-glavno" aria-labelledby="ogled-naslov">
      <div class="ogled-oder" data-ogled-oder data-youtube="{{ogled_youtube_id}}" data-oznaka="{{ogled_oznaka}}" data-pokoncno="{{ogled_pokoncno}}" data-stanje="pripravljen">
        <img class="ogled-oder-ozadje" src="{{ogled_slika}}" alt="" aria-hidden="true">
        <img class="ogled-oder-naslovnica" src="{{ogled_slika}}" alt="" data-naslovnica>
        <a class="ogled-oder-gumb" href="https://www.youtube.com/watch?v={{ogled_youtube_id}}" data-predvajaj aria-label="{{ogled_predvajaj}}: {{ogled_naslov}}, {{ogled_trajanje}}">
          <span class="ogled-oder-ikona" aria-hidden="true"></span>
          <span class="ogled-oder-cas">{{ogled_trajanje}}</span>
        </a>
      </div>

      <div class="ogled-podatki">
        <h1 id="ogled-naslov" class="serif">{{ogled_naslov}}</h1>
        <p class="ogled-opis">{{ogled_opis}}</p>
        <div class="ogled-dejanja">
          <button class="gumb gumb-majhen gumb-tihi" type="button" data-deli data-kopirano="{{ogled_kopirano}}">
            <svg class="ogled-ikona" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3.5M7.5 8 12 3.5 16.5 8"/><path d="M5 12.5V19a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 19 19v-6.5"/></svg>
            <span>{{ogled_deli}}</span>
          </button>
          <a class="gumb gumb-majhen gumb-tihi" href="https://www.youtube.com/watch?v={{ogled_youtube_id}}" rel="noopener" target="_blank">
            <svg class="ogled-ikona" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="4"/><path d="M10.2 9.2v5.6l4.8-2.8z" class="polno"/></svg>
            <span>{{ogled_youtube}}</span>
          </a>
        </div>
        <ol class="poglavja ogled-poglavja" data-poglavja {{ogled_poglavja_skrito}}>{{ogled_poglavja}}</ol>
        <p class="ogled-sporocilo" role="status" aria-live="polite" data-ogled-sporocilo hidden></p>
      </div>

      <section class="komentarji" id="komentarji" aria-labelledby="komentarji-naslov" data-komentarji data-oznaka="{{ogled_oznaka}}" data-jezik="{{lang}}"
        data-namig="{{komentar_namig}}" data-odgovor-namig="{{komentar_odgovor_namig}}" data-objavi="{{komentar_objavi}}"
        data-odgovori="{{komentar_odgovori}}" data-preklici="{{komentar_preklici}}" data-uredi="{{komentar_uredi}}" data-shrani="{{komentar_shrani}}"
        data-izbrisi="{{komentar_izbrisi}}" data-izbrisi-vprasanje="{{komentar_izbrisi_vprasanje}}" data-urejeno="{{komentar_urejeno}}"
        data-avtor="{{komentar_avtor}}" data-prijava-besedilo="{{komentar_prijava}}" data-prazno="{{komentar_prazno}}" data-zaprto="{{komentar_zaprto}}"
        data-napaka="{{komentar_napaka}}" data-ime="{{komentar_ime}}" data-ime-namig="{{komentar_ime_namig}}" data-vsec="{{komentar_vsec}}"
        data-clan="{{komentar_clan}}" data-predolgo="{{komentar_predolgo}}" data-omejitev="{{komentar_omejitev}}">
        <h2 id="komentarji-naslov" class="serif" data-komentarji-naslov>{{komentarji_naslov}}</h2>
        <div class="komentarji-pisanje" data-komentarji-pisanje></div>
        <p class="komentarji-stanje" data-komentarji-stanje>{{komentar_nalagam}}</p>
        <ol class="komentarji-seznam" data-komentarji-seznam></ol>
      </section>
    </article>

    <aside class="naprej" aria-labelledby="naprej-naslov"{{ogled_naprej_skrito}}>
      <h2 id="naprej-naslov" class="serif">{{ogled_serija}}</h2>
      <ul class="naprej-seznam">{{ogled_naprej_seznam}}</ul>
      <a class="gumb gumb-majhen gumb-tihi naprej-vsi" href="{{pot_vlogi}}">{{ogled_vsi}}</a>
    </aside>
  </div>
</main>

{{obvestilo}}
{{prijava}}

{{noga}}

<!-- knjižnice so na lastnem strežniku (gsap 3.15.0, lenis 1.3.26), brez CDN -->
<script src="{{koren}}js/knjiznice/gsap.min.js" defer></script>
<script src="{{koren}}js/knjiznice/ScrollTrigger.min.js" defer></script>
<script src="{{koren}}js/knjiznice/lenis.min.js" defer></script>
<script type="module" src="{{koren}}js/ogled.js"></script>
</body>
</html>
