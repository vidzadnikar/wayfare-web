<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{vlogi_naslov_strani}}</title>
<meta name="description" content="{{vlogi_opis}}">
<meta property="og:title" content="{{vlogi_naslov_strani}}">
<meta property="og:description" content="{{vlogi_opis}}">
<meta property="og:image" content="{{og_slika}}">
<link rel="alternate" hreflang="en" href="{{url_en}}">
<link rel="alternate" hreflang="sl" href="{{url_sl}}">
<link rel="icon" href="{{koren}}media/logo.svg" type="image/svg+xml">
<meta http-equiv="Content-Security-Policy" content="{{csp}}">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="preload" href="{{koren}}pisave/instrument-serif-latin-03435c.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{koren}}pisave/instrument-sans-latin-11aa49.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{koren}}css/pisave.css">
<link rel="stylesheet" href="{{koren}}css/slog.css">
<link rel="stylesheet" href="{{koren}}css/vlogi.css">
<script>document.documentElement.classList.add("js");{{preusmeritev}}</script>
</head>
<body>
<!-- Ta datoteka je zgrajena iz predloga-vlogi.html, deli/ in besedila.json (python3 zgradi.py). Ne urejaj je ročno. -->
<div class="svet" aria-hidden="true">
  <span class="svet-luc svet-luc-1" data-luc></span>
  <span class="svet-luc svet-luc-2" data-luc></span>
  <span class="svet-luc svet-luc-3" data-luc></span>
  <span class="svet-kazalec" data-kazalec></span>
</div>
<a class="preskoci" href="#vsebina">{{preskoci}}</a>

{{glava}}

<main id="vsebina" class="vlogi-stran">
  <section class="vlogi-uvod" id="vrh" aria-labelledby="vlogi-naslov">
    <h1 id="vlogi-naslov" class="serif" data-naslov-uvod>{{vlogi_naslov}}</h1>
    <p class="uvodnik" data-uvod>{{vlogi_uvod}}</p>
  </section>

  <section class="predvajalnik" id="predvajalnik" aria-labelledby="film-naslov" data-predvajalnik>
    <div class="kino-okvir platno" data-platno data-stanje="pripravljen" data-nacin="{{prvi_nacin}}" data-pokoncno="{{prvi_pokoncno}}" data-uvod>
      <img class="platno-ozadje" src="{{prvi_slika}}" alt="" aria-hidden="true" data-ozadje>
      <video preload="none" playsinline poster="{{prvi_slika}}" data-video aria-label="{{prvi_naslov}}"{{prvi_video_skrito}}>
        <source src="{{prvi_1080}}" type="video/mp4" media="(min-width: 900px)" data-vir="1080">
        <source src="{{prvi_720}}" type="video/mp4" data-vir="720">
      </video>
      <iframe class="platno-okvir" data-okvir{{prvi_okvir_src}} title="{{prvi_naslov}}" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"{{prvi_okvir_skrito}}></iframe>
      <div class="kino-gumb-ovoj" data-kino-gumb>
        <button class="kino-gumb" type="button" data-predvajaj><span class="kino-ikona" aria-hidden="true"></span>{{vlogi_predvajaj}}</button>
      </div>
      <p class="kino-napaka" role="status">{{kino_kmalu}}</p>
    </div>
    <div class="film-podatki" data-uvod>
      <h2 id="film-naslov" class="serif" data-film-naslov>{{prvi_naslov}}</h2>
      <ol class="poglavja" data-poglavja {{prvi_poglavja_skrito}}>{{prvi_poglavja}}</ol>
    </div>
    <p class="skrito" role="status" aria-live="polite" data-stanje-filma></p>
  </section>

  <section class="zbirka" aria-labelledby="zbirka-naslov">
    <div class="zbirka-notri">
      <h2 id="zbirka-naslov" class="serif" data-naslov>{{zbirka_naslov}}</h2>
      {{skupine}}
    </div>
  </section>
</main>

{{obvestilo}}
{{prijava}}

{{noga}}

<script type="application/json" id="vlogi-podatki">{{vlogi_json}}</script>
<!-- knjižnice so na lastnem strežniku (gsap 3.15.0, lenis 1.3.26), brez CDN -->
<script src="{{koren}}js/knjiznice/gsap.min.js" defer></script>
<script src="{{koren}}js/knjiznice/ScrollTrigger.min.js" defer></script>
<script src="{{koren}}js/knjiznice/lenis.min.js" defer></script>
<script type="module" src="{{koren}}js/vlogi.js"></script>
</body>
</html>
