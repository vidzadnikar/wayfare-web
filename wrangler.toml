# Cloudflare Pages: nastavitve zaledja strani (Pages Functions v mapi functions/,
# skupni moduli v zaledje/). Stran sama se objavi iz mape objava, ki jo zgradi
# stran/zgradi.py. Cloudflare to datoteko bere ob vsaki objavi iz GitHuba, zato
# tu ni skrivnosti: te so v nadzorni plošči Pages (Settings → Variables and
# Secrets ali `npx wrangler pages secret put IME --project-name wayfarestudio`),
# doma pa v .dev.vars (ni v gitu; vzorec je .dev.vars.primer). Tudi navadne
# spremenljivke (POSTA_PONUDNIK, POSTA_DNEVNO) so v plošči, ne tu, ker bi jih
# [vars] v tej datoteki povozil.
name = "wayfarestudio"
compatibility_date = "2026-09-01"
pages_build_output_dir = "objava"

# Baza članov (D1, regija WEUR), ustvarjena 14. 10. 2026 z
#     npx wrangler d1 create wayfare-clani
# Tabele naredi migracija:
#     npx wrangler d1 migrations apply wayfare-clani --remote
# Doma (npx wrangler pages dev) je baza lokalna, v .wrangler/, ista migracija z --local.
[[d1_databases]]
binding = "DB"
database_name = "wayfare-clani"
database_id = "b4c42dfd-7f6c-47e2-ba19-5726c94b3a52"
migrations_dir = "migrations"

# Filmi za naročnike: zasebno vedro R2, stran jih pošilja prek /api/video/…
# le članom z dostopom. Ustvari enkrat: npx wrangler r2 bucket create wayfare-vlogi
# Naloži filme: python3 zaledje/videi.py (doma --local za npx wrangler pages dev).
[[r2_buckets]]
binding = "VIDEI"
bucket_name = "wayfare-vlogi"
